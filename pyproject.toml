[project]
name = "chestnut-studio"
version = "1.0.0"
description = "现代化卡片化打轴工具 - 基于 PySide6 的字幕时间轴编辑器"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "kurikana" },
]
keywords = ["subtitle", "timeline", "karaoke", "pyside6", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=2.4.4",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.0",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[project.scripts]
chestnut = "main:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["chestnut_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
