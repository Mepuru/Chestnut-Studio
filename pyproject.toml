[project]
name = "chestnut-studio"
version = "2.6.0"
description = "视频笔记工具 — 边看视频边记时间戳笔记"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "kurikana" },
]
keywords = ["subtitle", "timeline", "karaoke", "pyside6", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "pyside6>=6.11.0",
]

[dependency-groups]
dev = [
    "imageio>=2.37.3",
    "nuitka>=4.1.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[project.scripts]
chestnut = "main:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["chestnut_studio"]

[tool.pyright]
include = ["chestnut_studio", "main.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"

# PySide6 枚举通过 Qt.XXX 简写访问（如 Qt.Key_F1 vs Qt.Key.Key_F1），
# Stubs 只定义了完整路径，运行时两者兼容。此选项抑制误报。
reportAttributeAccessIssue = "warning"

# Qt 中跨类访问 _protected 成员是惯用模式（如 MainWindow 访问 InputBar._input）
reportPrivateUsage = "none"

# 以下三项因 PySide6 枚举简写（Qt.Key_F1）类型为 Unknown 而级联触发，
# 非代码本身的问题。抑制为 warning 保留可见性但不阻断构建。
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportMissingTypeArgument = "warning"
reportOptionalMemberAccess = "warning"
reportUnnecessaryComparison = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
