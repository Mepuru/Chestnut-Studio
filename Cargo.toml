[package]
name = "chestnut-studio"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
mpv = ["dep:libmpv2"]

[dependencies]
# GUI
iced = { version = "0.13", features = ["canvas", "wgpu", "multi-window", "lazy", "tokio"] }

# State & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# File dialog
rfd = "0.15"

# Windows API for embedded video
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "libloaderapi"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Video playback (optional) - 使用 libmpv2 支持新版 mpv (API v2)
libmpv2 = { version = "5.0", optional = true }

# [TODO] Phase 3+: Audio waveform
# ffmpeg-next = "7.0"

[package.metadata]
# 用于打包时复制 DLL
mpv-dll = "libs/mpv/bin/mpv-2.dll"
