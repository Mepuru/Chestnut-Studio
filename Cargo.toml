[package]
name = "chestnut-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI
iced = { version = "0.13", features = ["canvas", "wgpu", "multi-window"] }

# State & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

