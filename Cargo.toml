[package]
name = "chestnut-studio"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []

[dependencies]
# GUI
iced = { version = "0.13", features = ["canvas", "wgpu", "multi-window", "lazy", "tokio"] }

# State & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# File dialog
rfd = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Image processing
image = "0.25"

# [TODO] Phase 3+: Audio waveform
# ffmpeg-next = "7.0"

[package.metadata]
# 用于打包时复制 DLL
mpv-dll = "libs/mpv/bin/mpv-2.dll"
