name: Bug 报告
description: 发现了一个问题或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交Bug报告！请尽量填写以下信息，以便我们更快地定位和修复问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述你遇到的问题
      placeholder: 请清晰地描述Bug现象
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个Bug？
      placeholder: |
        1. 打开应用
        2. 点击 '...'
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 你使用的Chestnut Studio版本号
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如果可以，请提供截图或录屏帮助说明问题
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他你认为有帮助的信息
    validations:
      required: false