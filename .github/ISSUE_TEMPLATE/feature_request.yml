name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请描述你想要的功能和使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能请求是否与某个问题相关？
      placeholder: 我在使用时感到沮丧，因为...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望实现的功能
      placeholder: 我希望能...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他替代方案？
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 重要程度
      options:
        - 最好能有（锦上添花）
        - 比较重要（提升体验）
        - 非常重要（影响使用）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于理解这个功能请求的信息，如截图、参考链接等
    validations:
      required: false